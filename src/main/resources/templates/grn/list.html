<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8" />
    <title>GRN List</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
</head>
<body class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>📦 Goods Received Notes (GRN)</h2>
        <a href="/grn/new" class="btn btn-success">+ Create New GRN</a>
    </div>

    <table class="table table-bordered table-striped">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>GRN Number</th>
                <th>PO Ref</th>
                <th>Supplier</th>
                <th>Received Date</th>
                <th>Total Amount</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="grn : ${grns}">
                <td th:text="${grn.id}"></td>
                <td th:text="${grn.grnNumber}"></td>
                <td th:text="${grn.purchaseOrder != null ? grn.purchaseOrder.poNumber : 'N/A'}"></td>
                <td th:text="${grn.supplier != null ? grn.supplier.name : 'N/A'}"></td>
                <td th:text="${grn.receivedDate}"></td>
                <td th:text="${grn.totalAmount}"></td>
            </tr>
        </tbody>
    </table>
    <a href="/" class="btn btn-secondary">Back to Dashboard</a>
</body>
</html>
