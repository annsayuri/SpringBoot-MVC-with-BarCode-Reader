<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Product CRUD</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">
    <h1 class="text-center mb-4">📊 Dashboard</h1>
    <p class="text-center text-muted">Welcome to Product CRUD Management System</p>

        <div class="col-md-3 mb-3">

                <div class="card-body">
                    <h3>📦</h3>
                    <h5 class="card-title">Products</h5>
                    <a href="/products" class="btn btn-primary">Manage</a>
                </div>
            </div>
        </div>
        <div class="col-md-3 mb-3">
            <div class="card text-center shadow-sm">
                <div class="card-body">
                    <h3>🏢</h3>
                    <h5 class="card-title">Suppliers</h5>
                    <a href="/suppliers" class="btn btn-primary">Manage</a>
                </div>
            </div>
        </div>
        <div class="col-md-3 mb-3">
            <div class="card text-center shadow-sm">
                <div class="card-body">
                    <h3>📋</h3>
                    <h5 class="card-title">Purchase Orders</h5>
                    <a href="/po" class="btn btn-primary">Manage</a>
                </div>
            </div>
        </div>
        <div class="col-md-3 mb-3">
            <div class="card text-center shadow-sm">
                <div class="card-body">
                    <h3>📥</h3>
                    <h5 class="card-title">GRN</h5>
                    <a href="/grn" class="btn btn-primary">Manage</a>
                </div>
            </div>
        </div>
    </div>

</html>
