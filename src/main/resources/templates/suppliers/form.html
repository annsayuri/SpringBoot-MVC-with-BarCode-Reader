<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Supplier Form</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">
    <h2 th:text="${supplier.id != null} ? '✏️ Edit Supplier' : '➕ Add New Supplier'">Supplier Form</h2>
    
    <form th:action="${supplier.id != null} ? @{/suppliers/update/{id}(id=${supplier.id})} : @{/suppliers}" 
          th:object="${supplier}" 
          method="post" 
          class="mt-3">
        
        <input type="hidden" th:field="*{id}" />
        
        <div class="mb-3">
            <label class="form-label">Supplier Name:</label>
            <input type="text" th:field="*{name}" class="form-control" required />
        </div>
        
        <div class="mb-3">
            <label class="form-label">Contact Person:</label>
            <input type="text" th:field="*{contactPerson}" class="form-control" />
        </div>
        
        <div class="mb-3">
            <label class="form-label">Email:</label>
            <input type="email" th:field="*{email}" class="form-control" />
        </div>
        
        <div class="mb-3">
            <label class="form-label">Phone:</label>
            <input type="text" th:field="*{phone}" class="form-control" />
        </div>
        
        <div class="mb-3">
            <label class="form-label">Address:</label>
            <textarea th:field="*{address}" class="form-control" rows="3"></textarea>
        </div>
        
        <button type="submit" class="btn btn-success">Save</button>
        <a href="/suppliers" class="btn btn-secondary">Cancel</a>
    </form>
</body>
</html>
