<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Create Purchase Order</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />
</head>
<body class="container mt-4">
    <h2>📝 Create Purchase Order</h2>
    <form id="poForm" class="mt-3">
        <div class="mb-3">
            <label class="form-label" for="poNumber">PO Number:</label>
            <input type="text" id="poNumber" name="poNumber" class="form-control" required="required" />
        </div>

        <div class="mb-3">
            <label class="form-label" for="supplierId">Supplier:</label>
            <select id="supplierId" name="supplierId" class="form-select" required="required">
                <option value="">Select Supplier</option>
                <option th:each="s : ${suppliers}" th:value="${s.id}" th:text="${s.name}"></option>
            </select>
        </div>

        <h4>Items</h4>
        <div id="itemsContainer">
            <div class="row g-3 mb-2 item-row" data-index="0">
                <div class="col-md-5">
                    <select class="form-select product-select" name="items[0].product.id" required="required">
                        <option value="">Select Product</option>
                        <option th:each="p : ${products}" th:value="${p.id}" th:text="${p.name}"></option>
                    </select>
                </div>
                <div class="col-md-3">
                    <input type="number" name="items[0].quantity" class="form-control qty-input" placeholder="Quantity" min="1" required="required" />
                </div>
                <div class="col-md-3">
                    <input type="number" name="items[0].unitPrice" step="0.01" class="form-control price-input" placeholder="Unit Price" required="required" />
                </div>
                <div class="col-md-1 d-flex align-items-start">
                    <button type="button" class="btn btn-danger btn-sm remove-item" title="Remove" style="display:none">−</button>
                </div>
            </div>
        </div>

        <div class="mt-2">
            <button type="button" id="addItemBtn" class="btn btn-outline-primary btn-sm">+ Add Item</button>
        </div>

        <button type="submit" class="btn btn-success mt-3">Save Purchase Order</button>
        <a href="/po" class="btn btn-secondary mt-3">Cancel</a>
    </form>

    <script>
        (function(){
            const itemsContainer = document.getElementById('itemsContainer');
            const addItemBtn = document.getElementById('addItemBtn');

            function reindexRows() {
                document.querySelectorAll('.item-row').forEach((row, idx) => {
                    row.setAttribute('data-index', idx);
                    row.querySelectorAll('select, input').forEach(el => {
                        const base = el.classList.contains('product-select') ? 'product.id' :
                                     el.classList.contains('qty-input') ? 'quantity' : 'unitPrice';
                        el.name = `items[${idx}].${base}`;
                    });
                    const removeBtn = row.querySelector('.remove-item');
                    removeBtn.style.display = (document.querySelectorAll('.item-row').length > 1) ? 'inline-block' : 'none';
                });
            }

            addItemBtn.addEventListener('click', () => {
                const first = document.querySelector('.item-row');
                const clone = first.cloneNode(true);
                clone.querySelectorAll('select, input').forEach(el => {
                    el.value = '';
                });
                itemsContainer.appendChild(clone);
                reindexRows();
            });

            itemsContainer.addEventListener('click', (e) => {
                if (e.target.classList.contains('remove-item')) {
                    e.target.closest('.item-row').remove();
                    reindexRows();
                }
            });

            document.getElementById('poForm').addEventListener('submit', async function(e) {
                e.preventDefault();

                // build payload to match backend DTOs
                const poNumber = document.getElementById('poNumber').value;
                const supplierId = document.getElementById('supplierId').value;

                const items = [];
                document.querySelectorAll('.item-row').forEach(row => {
                    const productId = row.querySelector('.product-select').value;
                    const qty = row.querySelector('.qty-input').value;
                    const price = row.querySelector('.price-input').value;
                    if (productId && qty && price) {
                        items.push({
                            product: { id: parseInt(productId) },
                            quantity: parseInt(qty),
                            unitPrice: parseFloat(price)
                        });
                    }
                });

                const payload = {
                    poNumber: poNumber,
                    supplier: { id: parseInt(supplierId) },
                    items: items
                };

                const csrfToken = document.querySelector('meta[name="_csrf"]').getAttribute('content');
                const csrfHeader = document.querySelector('meta[name="_csrf_header"]').getAttribute('content');

                try {
                    const response = await fetch('/po/api', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            [csrfHeader]: csrfToken
                        },
                        body: JSON.stringify(payload)
                    });

                    if (response.ok) {
                        window.location.href = '/po';
                    } else {
                        const txt = await response.text();
                        alert('Failed to create Purchase Order: ' + (txt || response.status));
                    }
                } catch (err) {
                    alert('Network error: ' + err.message);
                }
            });

            // initial setup
            reindexRows();
        })();
    </script>
</body>
</html>
