<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Purchase Orders List</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>📋 Purchase Orders (PO)</h2>
        <a href="/po/new" class="btn btn-primary">+ Create New PO</a>
    </div>

    <table class="table table-bordered table-striped">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>PO Number</th>
                <th>Supplier</th>
                <th>Order Date</th>
                <th>Status</th>
                <th>Total Amount</th>
            </tr>
        </thead>
        <tbody>
            <tr th:if="${#lists.isEmpty(purchaseOrders)}">
                <td colspan="6" class="text-center">No Purchase Orders found.</td>
            </tr>
            <tr th:each="po : ${purchaseOrders}">
                <td th:text="${po.id}">-</td>
                <td th:text="${po.poNumber}">-</td>
                <td th:text="${po.supplier != null ? po.supplier.name : 'N/A'}">-</td>
                <td th:text="${po.orderDate != null} ? ${#temporals.format(po.orderDate, 'yyyy-MM-dd')} : 'N/A'">-</td>
                <td>
                    <span th:if="${po.status == 'PENDING'}" class="badge bg-warning text-dark" th:text="${po.status}"></span>
                    <span th:if="${po.status == 'RECEIVED'}" class="badge bg-success" th:text="${po.status}"></span>
                    <span th:if="${po.status != 'PENDING' and po.status != 'RECEIVED'}" class="badge bg-secondary" th:text="${po.status}">-</span>
                </td>
                <td th:text="${po.totalAmount != null} ? ${#numbers.formatDecimal(po.totalAmount, 1, 2)} : '0.00'">0.00</td>
            </tr>
        </tbody>
    </table>
    <a href="/" class="btn btn-secondary">Back to Dashboard</a>
</body>
</html>
