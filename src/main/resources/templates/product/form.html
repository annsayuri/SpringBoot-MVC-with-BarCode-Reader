<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Product Form</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">
    <h2 th:text="${product.id != null} ? '✏️ Edit Product' : '➕ Add Product'">Product Form</h2>
    
    <form th:action="${product.id != null} ? @{/products/update/{id}(id=${product.id})} : @{/products}" 
          th:object="${product}" 
          method="post" 
          class="mt-3">
        
        <input type="hidden" th:field="*{id}" />
        
        <div class="mb-3">
            <label class="form-label">Product Name:</label>
            <input type="text" th:field="*{name}" class="form-control" required />
        </div>
        
        <div class="mb-3">
            <label class="form-label">Barcode:</label>
            <input type="text" th:field="*{barcode}" class="form-control" required />
        </div>
        
        <div class="mb-3">
            <label class="form-label">Price:</label>
            <input type="number" step="0.01" th:field="*{price}" class="form-control" required />
        </div>
        
        <div class="mb-3">
            <label class="form-label">Quantity:</label>
            <input type="number" th:field="*{quantity}" class="form-control" required />
        </div>
        
        <button type="submit" class="btn btn-success">Save</button>
        <a href="/products" class="btn btn-secondary">Cancel</a>
    </form>
</body>
</html>
