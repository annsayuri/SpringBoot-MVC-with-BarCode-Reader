<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Suppliers List</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>🏢 Suppliers</h2>
        <a href="/suppliers/new" class="btn btn-primary">+ Add Supplier</a>
    </div>

    <table class="table table-bordered table-striped">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Contact Person</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Address</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:if="${#lists.isEmpty(suppliers)}">
                <td colspan="8" class="text-center">No Suppliers found.</td>
            </tr>
            <tr th:each="supplier : ${suppliers}">
                <td th:text="${supplier.id}">-</td>
                <td th:text="${supplier.name}">-</td>
                <td th:text="${supplier.contactPerson}">-</td>
                <td th:text="${supplier.email}">-</td>
                <td th:text="${supplier.phone}">-</td>
                <td th:text="${supplier.address}">-</td>
                <td>
                    <span th:if="${supplier.active}" class="badge bg-success">Active</span>
                    <span th:if="${!supplier.active}" class="badge bg-danger">Inactive</span>
                </td>
                <td>
                    <a th:if="${supplier.active}" th:href="@{/suppliers/edit/{id}(id=${supplier.id})}" class="btn btn-sm btn-warning">Edit</a>
                    <a th:if="${supplier.active}" th:href="@{/suppliers/delete/{id}(id=${supplier.id})}" class="btn btn-sm btn-danger" onclick="return confirm('Are you sure?')">Delete</a>
                    <span th:if="${!supplier.active}" class="text-muted">Deactivated</span>
                </td>
            </tr>
        </tbody>
    </table>
    <a href="/" class="btn btn-secondary">Back to Dashboard</a>
</body>
</html>
